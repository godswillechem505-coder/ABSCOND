name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [abscond-portal, abscond-server]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
        if: matrix.app == 'abscond-portal'
      - run: npm run check
        if: matrix.app == 'abscond-server'
      - run: npm run build
        if: matrix.app == 'abscond-portal'
